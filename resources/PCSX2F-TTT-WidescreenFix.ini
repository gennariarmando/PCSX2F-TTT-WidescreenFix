;
; PCSX2F Tekken Tag Tournament Widescreen Fix
;

[MAIN]
; Set an aspect ratio. (Auto, 16:9, 21:9 or 4:3).
AspectRatio = Auto
; Scale the HUD to match the widened camera
HudFix = 1
; Shrink full-width textured images (logo, menu backgrounds, movies) to the 4:3 box instead of stretching them.
PillarboxFullWidth = 1
; Pillarbox frames that have no HUD and no 3D (logos, movie stills) and paint black side bars. Set the emulator's FMV Aspect Ratio Override to Off when using this.
PillarboxStills = 1
; Skip the first movie played after boot.
SkipIntro = 0
